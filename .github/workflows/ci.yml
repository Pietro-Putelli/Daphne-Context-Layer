name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://daphne:daphne@127.0.0.1:55432/daphne
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: docker compose up -d --wait db
      - run: docker compose exec -T db psql -U daphne -d daphne -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - run: bun test
      - run: bun run build
      - name: Check the production server
        shell: bash
        run: |
          bun run start &
          trap 'kill "$!"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000/ -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health | jq -e '.status == "ok"'
